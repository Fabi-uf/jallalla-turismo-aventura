# Optimiza las fotos subidas desde el panel (Pages CMS) y actualiza gallery.html.
# Se ejecuta solo al subir cambios a la galería; también se puede lanzar a mano desde la pestaña Actions.
name: Optimizar galería

on:
  push:
    branches: [main]
    paths:
      - "data/galeria.json"
      - "data/categorias.json"
      - "fotos-nuevas/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: galeria
  cancel-in-progress: false

jobs:
  galeria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pillow pillow-heif

      - name: Optimizar fotos y regenerar la galería
        run: python3 tools/galeria.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Galería: fotos optimizadas"
            git pull --rebase
            git push
          fi
